name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Preview build: placeholders allowed until the founder supplies the real content.
      # Switch to `pnpm build` (placeholders forbidden) for the launch branch.
      - run: pnpm build:preview
      # Playwright and Lighthouse CI jobs are added in Milestones 4–5.
